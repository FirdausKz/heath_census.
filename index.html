<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Health Analysis Data</title>
    <link rel="stylesheet" href="./health_analysis.css">
</head>

<body>
    <nav>
        <h1>Health Analysis Census</h1>
        <ul>
            <li><a href="./index.html" id="home">Home </a></li>
            <li><a href="./health_contact.html" id="contact">Contact Us </a></li>
            <li><input type="text" id="conditionInput" placeholder="Masukkan kondisi kesehatan"> </li>
            <li><button id='btnSearch'>Cari</button>
            </li>

        </ul>
    </nav>
    <div class="container">
        <div class="analysisForm">
            <h1>Analisis Data Kesehatan</h1>
            <div>
                <label for="name">Nama:</label>
                <input type="text" id="name">
            </div>
            <div>
                <label>Jenis Kelamin:</label>
                <label for="male">Pria</label>
                <input type="radio" name="gender" id="male" value="Male">
                <label for="female">Wanita</label>
                <input type="radio" name="gender" id="female" value="Female">
            </div>
            <div>
                <label for="age">Usia:</label>
                <input type="number" id="age">
            </div>
            <div>
                <label for="condition">Kondisi:</label>
                <select id="condition">
                    <option value="">Pilih kondisi</option>
                    <option value="Diabetes">Diabetes</option>
                    <option value="Tiroid">Tiroid</option>
                    <option value="Tekanan Darah Tinggi">Tekanan Darah Tinggi</option>
                </select>
            </div>
            <button id="addPatient">Tambah Pasien</button>
            <h2>Laporan Analisis</h2>
            <div id="report"></div>
        </div>
        <div class="searchCondition">
            <div id="result"></div>
        </div>
    </div>
    <script src="./health_analysis.js"></script>
</body>

</html>
