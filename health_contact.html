<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hubungi Kami</title>
  <link rel="stylesheet" href="./health_analysis.css">
  <style>
    body{
        text-align: center;
    }
    /* Beberapa gaya dasar untuk tujuan demonstrasi */
    #contactForm {
      max-width: 400px;
      margin: 0 auto;
    }
    #contactForm input,
    #contactForm textarea {
      width: 100%;
      margin-bottom: 15px;
      padding: 8px;
    }
    #contactForm button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    #contactForm button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <nav><h1>Analisis Kesehatan Sensus</h1>
    <ul>
      <li><a href="./index.html" id="home">Beranda </a></li>
      <li><a href="./health_contact.html" id="contact">Hubungi Kami </a></li>
      </li>

    </ul>
    </nav>
  <h1>Hubungi Kami</h1>
  <p>Jangan ragu untuk menghubungi kami untuk mengetahui lebih lanjut tentang kondisi Anda dan metode perawatan.</p>

  <form id="contactForm">
    <div>
      <label for="name">Nama</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div>
      <label for="condition">Kondisi</label>
      <input type="text" id="condition" name="condition" required>
    </div>
    <div>
      <label for="message">Pesan</label>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>
    <button type="submit" onclick="thankyou()">Kirim</button>
  </form>
  <script>
    function thankyou(){
        alert('Terima kasih telah menghubungi kami!')
    }
  </script>
</body>
</html>
